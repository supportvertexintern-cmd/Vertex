name: vertex_app
description: "Vertex International Recruitment & Mobility Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # ─── Core UI ────────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1                 # Outfit font
  phosphor_flutter: ^2.1.0             # Same icons as web

  # ─── Navigation & State ─────────────────────────────────────
  go_router: ^18.0.1
  provider: ^6.1.2

  # ─── Networking ─────────────────────────────────────────────
  dio: ^5.7.0
  web_socket_channel: ^3.0.2           # Real-time chat
  connectivity_plus: ^7.3.1

  # ─── Local Storage ──────────────────────────────────────────
  shared_preferences: ^2.3.3
  sqflite: ^2.4.1                      # Local message cache
  path_provider: ^2.1.5
  path: ^1.9.0

  # ─── Authentication ─────────────────────────────────────────
  flutter_secure_storage: ^11.2.0      # Refresh token (Keychain / Keystore)
  local_auth: ^3.0.2                   # Biometric login
  jwt_decoder: ^2.0.1

  # ─── Firebase (Push notifications) ─────────────────────────
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.3.0
  flutter_native_splash: ^2.4.6

  # ─── Device Features ────────────────────────────────────────
  image_picker: ^1.1.2
  camera: ^0.12.1
  geolocator: ^14.0.3                  # GPS
  permission_handler: ^12.0.0+1

  # ─── UI Helpers ─────────────────────────────────────────────
  cached_network_image: ^4.0.0
  flutter_svg: ^2.0.14
  intl: ^0.20.1
  url_launcher: ^6.3.1
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_native_splash:
  color: "#03120D"
  image: assets/images/vertex-logo-splash.png
  android_12:
    color: "#03120D"
    image: assets/images/vertex-logo-splash.png
    icon_background_color: "#03120D"
  android: true
  ios: true
  web: false
  fullscreen: true