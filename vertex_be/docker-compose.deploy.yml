# One stack per environment: backend, Postgres, pgAdmin, Flutter web, Next.js.
# Runs the prebuilt images CI pushed to GHCR — the same file serves
# vertex-dev and vertex-staging on this PC today, and a VPS later.
# Start/update it with deploy/deploy.sh, which sets ENV_FILE and IMAGE_TAG.
#
# pgAdmin only starts when the env file sets COMPOSE_PROFILES=pgadmin and is
# bound to localhost; leave the profile off on a VPS.

services:

  backend:
    image: ${IMAGE_REGISTRY:-ghcr.io/brookteferi}/vertex-backend:${IMAGE_TAG:?IMAGE_TAG is required}

    env_file:
      - ${ENV_FILE:-.env}

    ports:
      - "${BACKEND_PORT}:8000"

    volumes:
      - uploads:/app/uploads

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

    restart: unless-stopped

  db:
    image: postgres:15-alpine

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    # Localhost only, for tests and local tools.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

  flutter-web:
    image: ${IMAGE_REGISTRY:-ghcr.io/brookteferi}/vertex-flutter-web:${IMAGE_TAG:?IMAGE_TAG is required}

    # Served to the app as /config.json.
    environment:
      API_BASE_URL: ${PUBLIC_API_URL}
      APP_ENV: ${APP_ENV}

    ports:
      - "${FLUTTER_PORT}:80"

    restart: unless-stopped

  nextjs:
    image: ${IMAGE_REGISTRY:-ghcr.io/brookteferi}/vertex-nextjs:${IMAGE_TAG:?IMAGE_TAG is required}

    # Shares the stack's env file: DATABASE_URL points Prisma at this stack's
    # db, plus the Next-specific keys (JWT_SECRET, SMTP_*, STRIPE_*, …).
    env_file:
      - ${ENV_FILE:-.env}

    environment:
      NODE_ENV: production

    ports:
      - "${NEXTJS_PORT}:3000"

    # The backend applies migrations; Next.js only reads/writes the schema.
    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest

    profiles: [ "pgadmin" ]

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@vertex.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-}
      PGADMIN_SERVER_JSON_FILE: /tmp/servers.json

    # Pre-registers this stack's database (read on pgAdmin's first start only).
    entrypoint:
      - sh
      - -c
      - |
        echo '{"Servers": {"1": {"Name": "vertex-${APP_ENV}", "Group": "Vertex", "Host": "db", "Port": 5432, "MaintenanceDB": "${POSTGRES_DB}", "Username": "${POSTGRES_USER}", "SSLMode": "prefer"}}}' > /tmp/servers.json
        exec /entrypoint.sh

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5151}:80"

    depends_on:
      - db

    restart: unless-stopped

volumes:
  postgres_data:
  uploads:
  pgadmin_data:
