# One stack per environment: backend, Postgres, pgAdmin, Flutter web, Next.js.
# Runs the prebuilt images CI pushed to GHCR — the same file serves
# vertex-dev and vertex-staging on this PC today, and a VPS later.
# Start/update it with deploy/deploy.sh, which also provisions the database
# roles (deploy/db-roles.sql) each service connects as.
#
# pgAdmin is off by default (profile `pgadmin`); start it only when needed
# with deploy/pgadmin.sh. It is bound to localhost and connects as the
# read-only role.
#
# Assume breach (docs/security/zero-trust.md §8):
#  - Published ports bind to 127.0.0.1 unless BIND_ADDRESS says otherwise
#    (a VPS should keep them local and put a TLS reverse proxy in front).
#  - Networks are split. `data` is internal (no outbound traffic, no
#    published ports): only the database and the services that use it.
#    `edge` carries published ports and outbound traffic for those services
#    (Next.js needs SMTP/Stripe/AI APIs); the database is not on it, so it
#    can't reach the internet. Flutter's static server sits alone on
#    `static`. Postgres is unpublished unless docker-compose.db-port.yml is
#    added (deploy.sh does that when POSTGRES_HOST_PORT is set).

services:

  backend:
    image: ${IMAGE_REGISTRY:-ghcr.io/brookteferi}/vertex-backend:${IMAGE_TAG:?IMAGE_TAG is required}

    # Explicit, not env_file: each service sees only its own credentials,
    # never the superuser's or another service's.
    environment:
      APP_ENV: ${APP_ENV}
      DEBUG: ${DEBUG:-false}
      DATABASE_URL: postgresql://vertex_api:${DB_API_PASSWORD:?DB_API_PASSWORD is required}@db:5432/${POSTGRES_DB}
      MIGRATION_DATABASE_URL: postgresql://vertex_migrator:${DB_MIGRATOR_PASSWORD:?DB_MIGRATOR_PASSWORD is required}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}

    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT}:8000"

    volumes:
      - uploads:/app/uploads

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s


    networks: [ data, edge ]
    restart: unless-stopped

  db:
    image: postgres:15-alpine

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    # Not published: services reach it over `data`. Stacks that need host
    # access (dev: backend tests) add docker-compose.db-port.yml.

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10


    networks: [ data ]
    restart: unless-stopped

  flutter-web:
    image: ${IMAGE_REGISTRY:-ghcr.io/brookteferi}/vertex-flutter-web:${IMAGE_TAG:?IMAGE_TAG is required}

    # Served to the app as /config.json.
    environment:
      API_BASE_URL: ${PUBLIC_API_URL}
      APP_ENV: ${APP_ENV}

    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FLUTTER_PORT}:80"


    networks: [ static ]
    restart: unless-stopped

  nextjs:
    image: ${IMAGE_REGISTRY:-ghcr.io/brookteferi}/vertex-nextjs:${IMAGE_TAG:?IMAGE_TAG is required}

    # Explicit list (see backend). Prisma connects as vertex_web; the optional
    # integration keys are empty unless set in the env file.
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://vertex_web:${DB_WEB_PASSWORD:?DB_WEB_PASSWORD is required}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-}
      EMAIL_TOKEN_EXPIRES_IN: ${EMAIL_TOKEN_EXPIRES_IN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      PARTNER_SUBMISSION_NOTIFY_EMAIL: ${PARTNER_SUBMISSION_NOTIFY_EMAIL:-}
      PUBLIC_FORMS_NOTIFY_EMAIL: ${PUBLIC_FORMS_NOTIFY_EMAIL:-}
      CONSULTATION_NOTIFY_EMAIL: ${CONSULTATION_NOTIFY_EMAIL:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_API_BASE: ${PAYPAL_API_BASE:-}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-}
      # Documents go to this stack's MinIO (S3 API) with the app's own key,
      # limited to its bucket (deploy/minio-bootstrap.sh). For AWS S3: drop
      # S3_ENDPOINT, set S3_REGION and IAM keys (lib/upload.ts).
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      # Malware scanning: the shared ClamAV on the host (docker-compose.av.yml).
      # If it can't be reached, uploads are accepted as "unscanned" and
      # scanned on first access (owner's fail-open policy).
      CLAMD_HOST: ${CLAMD_HOST:-host.docker.internal}
      CLAMD_PORT: ${CLAMD_PORT:-3310}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-}
      INTAKE_MODE: ${INTAKE_MODE:-}

    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${NEXTJS_PORT}:3000"
    # Docker Desktop provides this name; on a Linux host it must be mapped.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # The backend applies migrations; Next.js only reads/writes the schema.
    depends_on:
      backend:
        condition: service_healthy
      minio:
        condition: service_healthy

    networks: [ data, edge ]
    restart: unless-stopped

  minio:
    image: ${IMAGE_REGISTRY:-ghcr.io/brookteferi}/vertex-minio:${IMAGE_TAG:?IMAGE_TAG is required}
    # S3-compatible object storage for uploaded documents. Files live on the
    # host in MINIO_DATA_DIR (D:/VertexData/minio/<env>). Only on the internal
    # `data` network: no published port, no web console.
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BROWSER: "off"
      # Read only by deploy/minio-bootstrap.sh, which creates the app's key.
      VERTEX_S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      VERTEX_S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      VERTEX_S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
    volumes:
      - ${MINIO_DATA_DIR:?MINIO_DATA_DIR is required}:/data
    networks: [ data ]
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest

    profiles: [ "pgadmin" ]

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@vertex.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-}
      PGADMIN_SERVER_JSON_FILE: /tmp/servers.json
      # Re-register on every start: always the read-only connection; anything
      # added by hand (e.g. a superuser login) is dropped at the next restart.
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"

    # Pre-registers this stack's database as the SELECT-only role
    # vertex_readonly (read on pgAdmin's first start only). Superuser access
    # is never pre-registered: add it by hand when you really need it.
    entrypoint:
      - sh
      - -c
      - |
        echo '{"Servers": {"1": {"Name": "vertex-${APP_ENV}", "Group": "Vertex", "Host": "db", "Port": 5432, "MaintenanceDB": "${POSTGRES_DB}", "Username": "vertex_readonly", "SSLMode": "prefer"}}}' > /tmp/servers.json
        exec /entrypoint.sh

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5151}:80"

    depends_on:
      - db


    networks: [ data, edge ]
    restart: unless-stopped

volumes:
  postgres_data:
  uploads:
  pgadmin_data:

networks:
  data:
    internal: true
  edge:
  static:
