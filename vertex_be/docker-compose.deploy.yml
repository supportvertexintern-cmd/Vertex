# One stack per environment: backend, Postgres, pgAdmin, Flutter web, Next.js.
# Runs the prebuilt images CI pushed to GHCR — the same file serves
# vertex-dev and vertex-staging on this PC today, and a VPS later.
# Start/update it with deploy/deploy.sh, which also provisions the database
# roles (deploy/db-roles.sql) each service connects as.
#
# pgAdmin is off by default (profile `pgadmin`); start it only when needed
# with deploy/pgadmin.sh. It is bound to localhost and connects as the
# read-only role.
#
# Assume breach (docs/security/zero-trust.md §8):
#  - Published ports bind to 127.0.0.1 unless BIND_ADDRESS says otherwise
#    (a VPS should keep them local and put a TLS reverse proxy in front).
#  - Networks are split. `data` is internal (no outbound traffic, no
#    published ports): only the database and the services that use it.
#    `edge` carries published ports and outbound traffic for those services
#    (Next.js needs SMTP/Stripe/AI APIs); the database is not on it, so it
#    can't reach the internet. Flutter's static server sits alone on
#    `static`. Postgres is unpublished unless docker-compose.db-port.yml is
#    added (deploy.sh does that when POSTGRES_HOST_PORT is set).
#
# Logs (Phase 10): every service writes JSON lines to stdout; Docker keeps
# them, rotated, on the host (only host admins can read them). Security
# alerts also go by email: on this PC to the stack's Mailpit (UI on
# 127.0.0.1:MAIL_UI_PORT); on a server, point SMTP_* at a real relay.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:

  backend:
    image: ${IMAGE_REGISTRY:-ghcr.io/supportvertexintern-cmd}/vertex-backend:${IMAGE_TAG:?IMAGE_TAG is required}

    # Explicit, not env_file: each service sees only its own credentials,
    # never the superuser's or another service's.
    environment:
      APP_ENV: ${APP_ENV}
      DEBUG: ${DEBUG:-false}
      # Shared rate-limit counters (workstream B).
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      DATABASE_URL: postgresql://vertex_api:${DB_API_PASSWORD:?DB_API_PASSWORD is required}@db:5432/${POSTGRES_DB}
      MIGRATION_DATABASE_URL: postgresql://vertex_migrator:${DB_MIGRATOR_PASSWORD:?DB_MIGRATOR_PASSWORD is required}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      # Shared with the web app: FastAPI issues sessions (users step 8.2)
      # and the website still verifies them (exception E8).
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      # Next.js's credential when it calls this service (G18). Required
      # outside development (app/core/config.py); _PREVIOUS only while
      # rotating it.
      SERVICE_AUTH_SECRET: ${SERVICE_AUTH_SECRET:-}
      SERVICE_AUTH_SECRET_PREVIOUS: ${SERVICE_AUTH_SECRET_PREVIOUS:-}
      # The same Stripe account as the web app's: FastAPI syncs each job
      # payment stage's Product and Price (step 3.2). Unset = no sync.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      # Payments (step 7.2): the website passes Stripe's webhook on and
      # FastAPI checks its signature; FastAPI talks to PayPal.
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_API_BASE: ${PAYPAL_API_BASE:-}
      # Google sign-in (users step 8.2): FastAPI exchanges the code. Unset =
      # Google sign-in is unavailable.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # The candidate pipeline's writes (pipeline-handover.md): on since the
      # switch (step 6.7). The rollback is to set it false and restore the
      # web app's grants (§6).
      PIPELINE_WRITES_ENABLED: ${PIPELINE_WRITES_ENABLED:-true}
      # Document uploads (step 6.3): the same storage and key as the web
      # app's, this stack's MinIO unless S3_ENDPOINT says otherwise.
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-}
      # The shared ClamAV on the host (docker-compose.av.yml); unreachable =
      # uploads kept as "unscanned" (fail-open).
      CLAMD_HOST: ${CLAMD_HOST:-host.docker.internal}
      CLAMD_PORT: ${CLAMD_PORT:-3310}
      CORS_ORIGINS: ${CORS_ORIGINS}

    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT}:8000"

    volumes:
      - uploads:/app/uploads

    # Docker Desktop provides this name; on a Linux host it must be mapped.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s


    networks: [ data, edge ]
    restart: unless-stopped
    logging: *default-logging

  db:
    image: postgres:15-alpine

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    # Not published: services reach it over `data`. Stacks that need host
    # access (dev: backend tests) add docker-compose.db-port.yml.

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10


    networks: [ data ]
    restart: unless-stopped
    logging: *default-logging

  flutter-web:
    image: ${IMAGE_REGISTRY:-ghcr.io/supportvertexintern-cmd}/vertex-flutter-web:${IMAGE_TAG:?IMAGE_TAG is required}

    # Served to the app as /config.json: FastAPI's URL, and the web app's,
    # where the app signs in (/api/auth/app/*).
    environment:
      API_BASE_URL: ${PUBLIC_API_URL}
      AUTH_BASE_URL: ${NEXT_PUBLIC_APP_URL}
      APP_ENV: ${APP_ENV}

    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FLUTTER_PORT}:80"


    networks: [ static ]
    restart: unless-stopped
    logging: *default-logging

  nextjs:
    image: ${IMAGE_REGISTRY:-ghcr.io/supportvertexintern-cmd}/vertex-nextjs:${IMAGE_TAG:?IMAGE_TAG is required}

    # Explicit list (see backend). Prisma connects as vertex_web; the optional
    # integration keys are empty unless set in the env file.
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://vertex_web:${DB_WEB_PASSWORD:?DB_WEB_PASSWORD is required}@db:5432/${POSTGRES_DB}
      # Workstream B (security review #5): the client's address comes from the
      # edge proxy's X-Real-IP (lib/client-ip.ts), and rate-limit counters
      # live in Redis, shared by every process (lib/rate-limit.ts).
      TRUST_PROXY_HEADERS: "true"
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      # callBackend() (lib/backend.ts): FastAPI on the stack's own network,
      # and the credential it signs each call with (G18).
      BACKEND_URL: http://backend:8000
      SERVICE_AUTH_SECRET: ${SERVICE_AUTH_SECRET:-}
      # Origins allowed to call the app sign-in routes (lib/app-auth.ts):
      # the Flutter web build. Native apps send no Origin.
      APP_ORIGINS: ${APP_ORIGINS:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      EMAIL_TOKEN_EXPIRES_IN: ${EMAIL_TOKEN_EXPIRES_IN:-}
      # Users step 8.3 (lib/flags.ts): "false" sends that area's routes back
      # to the website's own code, after a restart. Until step 8.5.
      FLAG_ACCOUNTS_FASTAPI_REGISTRATION: ${FLAG_ACCOUNTS_FASTAPI_REGISTRATION:-true}
      FLAG_ACCOUNTS_FASTAPI_RESET: ${FLAG_ACCOUNTS_FASTAPI_RESET:-true}
      FLAG_ACCOUNTS_FASTAPI_ADMIN_USERS: ${FLAG_ACCOUNTS_FASTAPI_ADMIN_USERS:-true}
      # Only to send visitors to Google; the secret is the backend's alone.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Unset = this stack's Mailpit (nothing leaves the PC).
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # Security alerts (lib/security-monitor.ts): comma-separated; unset =
      # every admin user.
      SECURITY_ALERT_EMAILS: ${SECURITY_ALERT_EMAILS:-}
      APP_ENV: ${APP_ENV}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PARTNER_SUBMISSION_NOTIFY_EMAIL: ${PARTNER_SUBMISSION_NOTIFY_EMAIL:-}
      PUBLIC_FORMS_NOTIFY_EMAIL: ${PUBLIC_FORMS_NOTIFY_EMAIL:-}
      CONSULTATION_NOTIFY_EMAIL: ${CONSULTATION_NOTIFY_EMAIL:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      # The Stripe webhook secret and PayPal's credentials are the backend's
      # since payments step 7.2: this app only passes those requests on.
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-}
      # Documents go to this stack's MinIO (S3 API) with the app's own key,
      # limited to its bucket (deploy/minio-bootstrap.sh). For AWS S3: drop
      # S3_ENDPOINT, set S3_REGION and IAM keys (lib/upload.ts).
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      # Malware scanning: the shared ClamAV on the host (docker-compose.av.yml).
      # If it can't be reached, uploads are accepted as "unscanned" and
      # scanned on first access (owner's fail-open policy).
      CLAMD_HOST: ${CLAMD_HOST:-host.docker.internal}
      CLAMD_PORT: ${CLAMD_PORT:-3310}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-}
      INTAKE_MODE: ${INTAKE_MODE:-}

    # No published port: the edge proxy below is the only way in, so nobody
    # can reach Next.js with an X-Real-IP of their own.
    # Docker Desktop provides this name; on a Linux host it must be mapped.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # The backend applies migrations; Next.js only reads/writes the schema.
    depends_on:
      backend:
        condition: service_healthy
      minio:
        condition: service_healthy

    networks: [ data, edge ]
    restart: unless-stopped
    logging: *default-logging

  minio:
    image: ${IMAGE_REGISTRY:-ghcr.io/supportvertexintern-cmd}/vertex-minio:${IMAGE_TAG:?IMAGE_TAG is required}
    # S3-compatible object storage for uploaded documents. Files live on the
    # host in MINIO_DATA_DIR (D:/VertexData/minio/<env>). Only on the internal
    # `data` network: no published port, no web console.
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BROWSER: "off"
      # Read only by deploy/minio-bootstrap.sh, which creates the app's key.
      VERTEX_S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      VERTEX_S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      VERTEX_S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
    volumes:
      - ${MINIO_DATA_DIR:?MINIO_DATA_DIR is required}:/data
    networks: [ data ]
    restart: unless-stopped
    logging: *default-logging

  edge:
    # The edge proxy (deploy/edge/Caddyfile), published on NEXTJS_PORT: sets
    # the client's real address for the website. Workstream B.
    image: caddy:2.10-alpine
    volumes:
      - ./deploy/edge/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${NEXTJS_PORT}:80"
    depends_on:
      nextjs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/jobs"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [ edge ]
    restart: unless-stopped
    logging: *default-logging

  redis:
    # Rate-limit counters shared by every website and API process
    # (workstream B). Internal network only, a password, nothing kept on
    # disk: a restart only resets the counters.
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --save '' --appendonly no --maxmemory 64mb --maxmemory-policy volatile-ttl"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [ data ]
    restart: unless-stopped
    logging: *default-logging

  mailpit:
    # Local mail catcher: the app's email, security alerts included, lands
    # here instead of real inboxes. Web UI on 127.0.0.1 only; it never relays
    # anything onward.
    image: axllent/mailpit:v1.31.4
    environment:
      MP_MAX_MESSAGES: "5000"
    ports:
      - "127.0.0.1:${MAIL_UI_PORT:-8025}:8025"
    networks: [ data, edge ]
    restart: unless-stopped
    logging: *default-logging

  pgadmin:
    image: dpage/pgadmin4:latest

    profiles: [ "pgadmin" ]

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@vertex.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-}
      PGADMIN_SERVER_JSON_FILE: /tmp/servers.json
      # Re-register on every start: always the read-only connection; anything
      # added by hand (e.g. a superuser login) is dropped at the next restart.
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"

    # Pre-registers this stack's database as the SELECT-only role
    # vertex_readonly (read on pgAdmin's first start only). Superuser access
    # is never pre-registered: add it by hand when you really need it.
    entrypoint:
      - sh
      - -c
      - |
        echo '{"Servers": {"1": {"Name": "vertex-${APP_ENV}", "Group": "Vertex", "Host": "db", "Port": 5432, "MaintenanceDB": "${POSTGRES_DB}", "Username": "vertex_readonly", "SSLMode": "prefer"}}}' > /tmp/servers.json
        exec /entrypoint.sh

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5151}:80"

    depends_on:
      - db


    networks: [ data, edge ]
    restart: unless-stopped
    logging: *default-logging

volumes:
  postgres_data:
  uploads:
  pgadmin_data:

networks:
  data:
    internal: true
  edge:
  static:
