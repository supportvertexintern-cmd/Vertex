# One stack per environment: backend, Postgres, pgAdmin, Flutter web, Next.js.
# Runs the prebuilt images CI pushed to GHCR — the same file serves
# vertex-dev and vertex-staging on this PC today, and a VPS later.
# Start/update it with deploy/deploy.sh, which also provisions the database
# roles (deploy/db-roles.sql) each service connects as.
#
# pgAdmin only starts when the env file sets COMPOSE_PROFILES=pgadmin and is
# bound to localhost; leave the profile off on a VPS.
#
# Assume breach (docs/security/zero-trust.md §8):
#  - Published ports bind to 127.0.0.1 unless BIND_ADDRESS says otherwise
#    (a VPS should keep them local and put a TLS reverse proxy in front).
#  - Networks are split: only services that use the database are on `data`;
#    the static Flutter server sits alone on `static` and can't reach it.

services:

  backend:
    image: ${IMAGE_REGISTRY:-ghcr.io/brookteferi}/vertex-backend:${IMAGE_TAG:?IMAGE_TAG is required}

    # Explicit, not env_file: each service sees only its own credentials,
    # never the superuser's or another service's.
    environment:
      APP_ENV: ${APP_ENV}
      DEBUG: ${DEBUG:-false}
      DATABASE_URL: postgresql://vertex_api:${DB_API_PASSWORD:?DB_API_PASSWORD is required}@db:5432/${POSTGRES_DB}
      MIGRATION_DATABASE_URL: postgresql://vertex_migrator:${DB_MIGRATOR_PASSWORD:?DB_MIGRATOR_PASSWORD is required}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}

    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT}:8000"

    volumes:
      - uploads:/app/uploads

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s


    networks: [ data ]
    restart: unless-stopped

  db:
    image: postgres:15-alpine

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    # Localhost only, for tests and local tools.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10


    networks: [ data ]
    restart: unless-stopped

  flutter-web:
    image: ${IMAGE_REGISTRY:-ghcr.io/brookteferi}/vertex-flutter-web:${IMAGE_TAG:?IMAGE_TAG is required}

    # Served to the app as /config.json.
    environment:
      API_BASE_URL: ${PUBLIC_API_URL}
      APP_ENV: ${APP_ENV}

    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FLUTTER_PORT}:80"


    networks: [ static ]
    restart: unless-stopped

  nextjs:
    image: ${IMAGE_REGISTRY:-ghcr.io/brookteferi}/vertex-nextjs:${IMAGE_TAG:?IMAGE_TAG is required}

    # Explicit list (see backend). Prisma connects as vertex_web; the optional
    # integration keys are empty unless set in the env file.
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://vertex_web:${DB_WEB_PASSWORD:?DB_WEB_PASSWORD is required}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-}
      EMAIL_TOKEN_EXPIRES_IN: ${EMAIL_TOKEN_EXPIRES_IN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      PARTNER_SUBMISSION_NOTIFY_EMAIL: ${PARTNER_SUBMISSION_NOTIFY_EMAIL:-}
      PUBLIC_FORMS_NOTIFY_EMAIL: ${PUBLIC_FORMS_NOTIFY_EMAIL:-}
      CONSULTATION_NOTIFY_EMAIL: ${CONSULTATION_NOTIFY_EMAIL:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_API_BASE: ${PAYPAL_API_BASE:-}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-}
      INTAKE_MODE: ${INTAKE_MODE:-}

    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${NEXTJS_PORT}:3000"

    # The backend applies migrations; Next.js only reads/writes the schema.
    depends_on:
      backend:
        condition: service_healthy


    networks: [ data ]
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest

    profiles: [ "pgadmin" ]

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@vertex.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-}
      PGADMIN_SERVER_JSON_FILE: /tmp/servers.json

    # Pre-registers this stack's database (read on pgAdmin's first start only).
    entrypoint:
      - sh
      - -c
      - |
        echo '{"Servers": {"1": {"Name": "vertex-${APP_ENV}", "Group": "Vertex", "Host": "db", "Port": 5432, "MaintenanceDB": "${POSTGRES_DB}", "Username": "${POSTGRES_USER}", "SSLMode": "prefer"}}}' > /tmp/servers.json
        exec /entrypoint.sh

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5151}:80"

    depends_on:
      - db


    networks: [ data ]
    restart: unless-stopped

volumes:
  postgres_data:
  uploads:
  pgadmin_data:

networks:
  data:
  static:
