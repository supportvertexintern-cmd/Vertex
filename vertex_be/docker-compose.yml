# Local development stack: API with live reload from the working tree, Postgres
# and pgAdmin. Staging/production use docker-compose.deploy.yml instead.
#
#   docker compose up -d     →  API  http://localhost:${BACKEND_PORT}/docs
#                               pgAdmin  http://localhost:${PGADMIN_PORT}

name: vertex-dev

services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: vertex-dev-backend

    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

    volumes:
      - .:/app

    env_file:
      - .env

    ports:
      - "${BACKEND_PORT}:8000"

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped

  db:
    image: postgres:15-alpine

    container_name: vertex-dev-db

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    # Exposed so tests and local tools can reach it on localhost.
    ports:
      - "${POSTGRES_PORT}:5432"

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest

    container_name: vertex-dev-pgadmin

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_SERVER_JSON_FILE: /tmp/servers.json

    # Pre-registers this stack's database (read on pgAdmin's first start only).
    entrypoint:
      - sh
      - -c
      - |
        echo '{"Servers": {"1": {"Name": "vertex-dev", "Group": "Vertex", "Host": "db", "Port": 5432, "MaintenanceDB": "${POSTGRES_DB}", "Username": "${POSTGRES_USER}", "SSLMode": "prefer"}}}' > /tmp/servers.json
        exec /entrypoint.sh

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    ports:
      - "${PGADMIN_PORT}:80"

    depends_on:
      - db

    restart: unless-stopped

# Named so the vertex-web stack can join it and reach `vertex-dev-db`.
networks:
  default:
    name: vertex-dev

volumes:
  postgres_data:
    name: vertex_postgres_data
  pgadmin_data:
    name: vertex-dev_pgadmin_data
