services:

  web:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: vertex_backend

    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

    volumes:
      - .:/app

    env_file:
      - .env

    ports:
      - "${BACKEND_PORT}:8000"

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped

  db:
    image: postgres:15-alpine

    container_name: vertex_db

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "${POSTGRES_PORT}:5432"

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

# pgAdmin isn't part of this stack — use the shared one already running on
# :5050 and register this database there as host.docker.internal:5432.

volumes:
  postgres_data:
    name: vertex_postgres_data
