# Install once per clone:  pip install pre-commit && pre-commit install --install-hooks
#                          (installs both the pre-commit and pre-push hooks)
# Run on everything:       pre-commit run --all-files

default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: check-yaml
        args: ["--allow-multiple-documents"]

  - repo: local
    hooks:
      # Belt and braces with gitleaks: refuse env files and local databases by
      # name, including ones force-added past .gitignore.
      - id: forbid-secret-files
        name: forbid env files and local databases
        language: fail
        entry: "Env files and local databases must never be committed (see docs/secrets.md)"
        files: '(^|/)\.env(\.[^/]+)?$|\.(db|sqlite3?|dump)$'

      # GitHub can't protect `main` on this private repo without a paid plan,
      # and a push to `main` can reach production (docs/security/
      # phase2-verification.md, incident). Changes reach `main` through a
      # pull request merged on GitHub, never a push from a clone.
      - id: no-push-to-main
        name: refuse pushes to main
        language: system
        entry: >-
          sh -c '[ "$PRE_COMMIT_REMOTE_BRANCH" != refs/heads/main ] || { echo "main is protected - open a pull request instead"; exit 1; }'
        pass_filenames: false
        always_run: true
        stages: [pre-push]
