# Install once per clone:  pip install pre-commit && pre-commit install
# Run on everything:       pre-commit run --all-files

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: check-yaml
        args: ["--allow-multiple-documents"]

  - repo: local
    hooks:
      # Belt and braces with gitleaks: refuse env files and local databases by
      # name, including ones force-added past .gitignore.
      - id: forbid-secret-files
        name: forbid env files and local databases
        language: fail
        entry: "Real env files / databases must not be committed — use a *.example template"
        files: '(^|/)\.env(\.[^/]+)?$|\.(db|sqlite3?|dump)$'
        exclude: '\.example$'
