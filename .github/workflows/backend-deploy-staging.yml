name: Backend deploy — staging

# Every push to `staging` that touches the backend: test → build & push image
# to GHCR → deploy to the staging VPS over SSH.
#
# Configure under Settings → Environments → staging:
#   secrets: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, SSH_KNOWN_HOSTS
#   vars (optional): SSH_PORT (default 22), DEPLOY_PATH (default /opt/vertex/staging)

on:
  push:
    branches: [staging]
    paths: ["vertex_be/**", ".github/workflows/backend-*.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  test:
    uses: ./.github/workflows/backend-ci.yml

  build:
    name: Build & push image
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image reference
        id: ref
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vertex-backend"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "image=$repo:staging-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: vertex_be
          push: true
          tags: |
            ${{ steps.ref.outputs.image }}
            ${{ steps.ref.outputs.repo }}:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to staging
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/vertex/staging' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            vertex_be/deploy
            vertex_be/docker-compose.deploy.yml
          sparse-checkout-cone-mode: false

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host target
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/id_deploy
            StrictHostKeyChecking yes
          EOF

      - name: Upload compose file and deploy script
        run: |
          ssh target "mkdir -p '$DEPLOY_PATH'"
          scp vertex_be/docker-compose.deploy.yml vertex_be/deploy/deploy.sh "target:$DEPLOY_PATH/"

      - name: Pull image and restart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | ssh target "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          status=0
          ssh target "cd '$DEPLOY_PATH' && sh deploy.sh vertex-staging '$IMAGE'" || status=$?
          ssh target "docker logout ghcr.io" || true
          exit $status
