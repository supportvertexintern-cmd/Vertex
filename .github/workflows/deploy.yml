name: Deploy

# Push to `dev` → vertex-dev, push to `staging` → vertex-staging:
#   CI (all apps) → build & push all images to GHCR → self-hosted runner on
#   the Docker host pulls them and restarts that stack (deploy/deploy.sh).
#
# Setup: register a self-hosted runner on the Docker host (label `vertex-host`)
# and keep `.env.dev` / `.env.staging` in LOCAL_ENV_DIR on that machine.
# See vertex_be/deploy/README.md.

on:
  push:
    branches: [dev, staging]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: Push ${{ matrix.image }}
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { image: vertex-backend, context: vertex_be }
          - { image: vertex-flutter-web, context: vertex_app }
          - { image: vertex-nextjs, context: vertex }
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name
        id: ref
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ steps.ref.outputs.repo }}:${{ github.ref_name }}-${{ github.sha }}
            ${{ steps.ref.outputs.repo }}:${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy to vertex-${{ github.ref_name }}
    needs: build
    runs-on: [self-hosted, vertex-host]
    environment: ${{ github.ref_name }}
    env:
      PROJECT: vertex-${{ github.ref_name }}
      IMAGE_TAG: ${{ github.ref_name }}-${{ github.sha }}
      ENV_FILE: ${{ vars.LOCAL_ENV_DIR || 'D:/Django Projects/Vertex/vertex_be' }}/.env.${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            vertex_be/deploy
            vertex_be/docker-compose.deploy.yml
          sparse-checkout-cone-mode: false

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull images and restart the stack
        shell: powershell
        working-directory: vertex_be
        run: |
          & "C:\Program Files\Git\bin\bash.exe" deploy/deploy.sh $env:PROJECT $env:IMAGE_TAG
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Summary
        if: success()
        continue-on-error: true
        shell: powershell
        run: |
          $f = Get-Content $env:ENV_FILE | ConvertFrom-StringData -ErrorAction SilentlyContinue
          @"
          ### Deployed ``$env:IMAGE_TAG`` to **$env:PROJECT**
          | Service | URL |
          |---|---|
          | API docs | http://localhost:$($f.BACKEND_PORT)/docs |
          | Flutter web | http://localhost:$($f.FLUTTER_PORT) |
          | Next.js | http://localhost:$($f.NEXTJS_PORT) |
          | pgAdmin | http://localhost:$($f.PGADMIN_PORT) |
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
