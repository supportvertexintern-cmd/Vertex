name: Backend CI

on:
  push:
    # `staging` pushes are tested by the staging deploy workflow.
    branches: [dev, main]
    paths: ["vertex_be/**", ".github/workflows/backend-*.yml"]
  pull_request:
    branches: [dev, staging, main]
    paths: ["vertex_be/**", ".github/workflows/backend-*.yml"]
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: vertex_be

jobs:
  test:
    name: Tests (migrations + schema parity)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: vertexdb_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d vertexdb_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vertexdb_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # matches the Docker image
          cache: pip
          cache-dependency-path: vertex_be/requirements.txt

      - run: pip install -r requirements.txt

      - run: python -m pytest -q

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: vertex_be
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
