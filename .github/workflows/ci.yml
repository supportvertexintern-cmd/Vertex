name: CI

# Checks every app and that every image builds. Runs on PRs into the
# environment branches and on pushes to main; pushes to dev/staging run it via
# deploy.yml before deploying.

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Uses the repo's .gitleaks.toml, which adds env-file and weak-password
      # rules on top of gitleaks' defaults.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner --verbose

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vertex_be

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: vertexdb_test
          POSTGRES_USER: postgres
          # Disposable DB reachable only inside this job: no password at all,
          # so nothing in CI looks like a credential to secret scanners.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d vertexdb_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/vertexdb_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # matches the Docker image
          cache: pip
          cache-dependency-path: vertex_be/requirements.txt

      - run: pip install -r requirements.txt

      - run: python -m pytest -q

  flutter:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vertex_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2" # matches vertex_app/Dockerfile
          channel: stable
          cache: true

      - run: flutter pub get

      # Errors fail the build; warnings are reported but don't (yet).
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - run: flutter test

  nextjs:
    name: Next.js typecheck & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vertex

    # Integration tests hit a real, seeded database.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: vertex_next_test
          POSTGRES_USER: postgres
          # Disposable DB reachable only inside this job: no password at all,
          # so nothing in CI looks like a credential to secret scanners.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d vertex_next_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      # Document storage tests run against this stack's own MinIO image.
      minio:
        image: ghcr.io/brookteferi/vertex-minio:dev
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          MINIO_ROOT_USER: ci-root
          MINIO_ROOT_PASSWORD: minio-ci-${{ github.run_id }}-${{ github.run_attempt }}
          MINIO_BROWSER: "off"
        ports: ["9000:9000"]
      # Malware scanning tests (EICAR) need a real clamd; it loads its
      # signatures on start, and the job waits for its health check.
      clamav:
        image: clamav/clamav:stable
        ports: ["3310:3310"]

    # Pull the private MinIO image; nothing else.
    permissions:
      contents: read
      packages: read

    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/vertex_next_test
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: vertex-ci
      S3_ACCESS_KEY_ID: ci-root
      S3_SECRET_ACCESS_KEY: minio-ci-${{ github.run_id }}-${{ github.run_attempt }}
      CLAMD_HOST: localhost
      CLAMD_PORT: "3310"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22" # matches vertex/Dockerfile
          cache: npm
          cache-dependency-path: vertex/package-lock.json

      - run: npm ci

      - run: npx tsc --noEmit

      - run: npx prisma db push --skip-generate && npx prisma db seed

      - name: Create the test bucket
        run: docker exec ${{ job.services.minio.id }} sh -c 'export MC_CONFIG_DIR=/tmp/.mc; mc alias set l http://127.0.0.1:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null && mc mb --ignore-existing l/vertex-ci'

      - run: npx vitest run

  e2e:
    name: End-to-end journeys
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vertex

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: vertex_e2e
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d vertex_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
      minio:
        image: ghcr.io/brookteferi/vertex-minio:dev
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          MINIO_ROOT_USER: ci-root
          MINIO_ROOT_PASSWORD: minio-ci-${{ github.run_id }}-${{ github.run_attempt }}
          MINIO_BROWSER: "off"
        ports: ["9000:9000"]
      # Catches the invite and notification emails the journeys send.
      mailpit:
        image: axllent/mailpit
        ports: ["1025:1025"]

    permissions:
      contents: read
      packages: read

    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/vertex_e2e
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: vertex-e2e
      S3_ACCESS_KEY_ID: ci-root
      S3_SECRET_ACCESS_KEY: minio-ci-${{ github.run_id }}-${{ github.run_attempt }}
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      EMAIL_FROM: e2e@test.local
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      # The journeys log in many times from one machine (default limit: 10/min).
      LOGIN_RATE_LIMIT_MAX: "1000"
      E2E_PORT: "3100"
      E2E_WEB_SERVER: npx next start -p 3100

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vertex/package-lock.json

      - run: npm ci

      # A fresh signing key per run, so no secret-looking value lives here.
      - run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - run: npx prisma db push --skip-generate && npx prisma db seed

      - name: Create the e2e bucket
        run: docker exec ${{ job.services.minio.id }} sh -c 'export MC_CONFIG_DIR=/tmp/.mc; mc alias set l http://127.0.0.1:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null && mc mb --ignore-existing l/vertex-e2e'

      - run: npx next build

      - run: npx playwright install --with-deps chromium

      - run: npx playwright test --reporter=line

      - name: Keep screenshots and traces of failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures
          path: vertex/test-results
          retention-days: 14

  images:
    name: Image builds (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: vertex-backend, context: vertex_be }
          - { image: vertex-flutter-web, context: vertex_app }
          - { image: vertex-nextjs, context: vertex }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
