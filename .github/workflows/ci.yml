name: CI

# Runs on PRs into the environment branches; merges then build images
# (build.yml) without running CI again. The repo is private on GitHub Free
# (2,000 Actions minutes a month; October's ran out on 2026-10-13), so:
#   - PRs into dev run the secret scan plus only the suites whose folders
#     changed;
#   - PRs into staging or main, manual runs, and promote.yml (which calls
#     this before fast-forwarding staging or main) run everything,
#     including the end-to-end journeys and the image builds and scans.
# "CI passed" is the one check to wait for before merging.

on:
  pull_request:
    branches: [dev, staging, main]
    # Docs-only changes don't run CI.
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:
  workflow_call:

# A newer push to the same pull request cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Which areas a PR into dev touches. Promotions and manual runs ignore this
  # and run everything (github.base_ref is not dev).
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      app: ${{ steps.filter.outputs.app }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'vertex_be/**'
            web:
              - 'vertex/**'
            app:
              - 'vertex_app/**'
            infra:
              - '.github/**'
              - '.trivyignore.yaml'
              - '**/Dockerfile'
              - '**/docker-compose*.yml'

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Uses the repo's .gitleaks.toml, which adds env-file and weak-password
      # rules on top of gitleaks' defaults.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner --verbose

  backend:
    name: Backend tests
    needs: changes
    if: github.base_ref != 'dev' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vertex_be

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: vertexdb_test
          POSTGRES_USER: postgres
          # Disposable DB reachable only inside this job: no password at all,
          # so nothing in CI looks like a credential to secret scanners.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d vertexdb_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/vertexdb_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # matches the Docker image
          cache: pip
          cache-dependency-path: vertex_be/requirements.txt

      - run: pip install -r requirements.txt

      - run: python -m pytest -q

  flutter:
    name: Flutter analyze & test
    needs: changes
    if: github.base_ref != 'dev' || needs.changes.outputs.app == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vertex_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2" # matches vertex_app/Dockerfile
          channel: stable
          cache: true

      - run: flutter pub get

      # Errors fail the build; warnings are reported but don't (yet).
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - run: flutter test

  # Also runs when only the backend changed: its schema comes from the
  # backend's Alembic migrations.
  nextjs:
    name: Next.js typecheck & test
    needs: changes
    if: github.base_ref != 'dev' || needs.changes.outputs.web == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vertex

    # Integration tests hit a real, seeded database.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: vertex_next_test
          POSTGRES_USER: postgres
          # Disposable DB reachable only inside this job: no password at all,
          # so nothing in CI looks like a credential to secret scanners.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d vertex_next_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      # Document storage tests run against this stack's own MinIO image.
      minio:
        image: ghcr.io/supportvertexintern-cmd/vertex-minio:dev
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          MINIO_ROOT_USER: ci-root
          MINIO_ROOT_PASSWORD: minio-ci-${{ github.run_id }}-${{ github.run_attempt }}
          MINIO_BROWSER: "off"
        ports: ["9000:9000"]
      # Malware scanning tests (EICAR) need a real clamd; it loads its
      # signatures on start, and the job waits for its health check.
      clamav:
        image: clamav/clamav:stable
        ports: ["3310:3310"]

    # Pull the private MinIO image; nothing else.
    permissions:
      contents: read
      packages: read

    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/vertex_next_test
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: vertex-ci
      S3_ACCESS_KEY_ID: ci-root
      S3_SECRET_ACCESS_KEY: minio-ci-${{ github.run_id }}-${{ github.run_attempt }}
      CLAMD_HOST: localhost
      CLAMD_PORT: "3310"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22" # matches vertex/Dockerfile
          cache: npm
          cache-dependency-path: vertex/package-lock.json

      - run: npm ci

      - run: npx tsc --noEmit

      # Errors fail the build; warnings (the React Compiler rules, see
      # eslint.config.mjs) are reported but don't, yet.
      - run: npm run lint

      # E1: what ships must have no known advisories; dev-only tooling
      # (the ESLint chain's `braces`) must never reach production. Runs on
      # every pull request, so every lockfile change is re-checked.
      - name: Production dependencies (E1)
        run: |
          npm audit --omit=dev --audit-level=high
          if npm ls braces --omit=dev --parseable 2>/dev/null | grep -q braces; then
            echo "braces (E1 exception: dev-only) is now a production dependency" >&2; exit 1
          fi

      # The schema comes from the Alembic migrations, exactly as every
      # deployed stack gets it, never from `prisma db push`: tests must run
      # against the schema that is deployed (a push here hid a drift
      # between the two until the 2026-10-11 DAST scan).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: vertex_be/requirements.txt
      - run: pip install -r requirements.txt && alembic upgrade head
        working-directory: vertex_be
      - run: npx prisma db seed

      - name: Create the test bucket
        run: docker exec ${{ job.services.minio.id }} sh -c 'export MC_CONFIG_DIR=/tmp/.mc; mc alias set l http://127.0.0.1:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null && mc mb --ignore-existing l/vertex-ci'

      - run: npx vitest run

  # The most expensive job: promotions and manual runs only.
  e2e:
    name: End-to-end journeys
    needs: nextjs
    if: github.base_ref != 'dev'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vertex

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: vertex_e2e
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d vertex_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
      minio:
        image: ghcr.io/supportvertexintern-cmd/vertex-minio:dev
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          MINIO_ROOT_USER: ci-root
          MINIO_ROOT_PASSWORD: minio-ci-${{ github.run_id }}-${{ github.run_attempt }}
          MINIO_BROWSER: "off"
        ports: ["9000:9000"]
      # Catches the invite and notification emails the journeys send.
      mailpit:
        image: axllent/mailpit
        ports: ["1025:1025"]

    permissions:
      contents: read
      packages: read

    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/vertex_e2e
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: vertex-e2e
      S3_ACCESS_KEY_ID: ci-root
      S3_SECRET_ACCESS_KEY: minio-ci-${{ github.run_id }}-${{ github.run_attempt }}
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      EMAIL_FROM: e2e@test.local
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      # The journeys log in many times from one machine (default limit: 10/min).
      LOGIN_RATE_LIMIT_MAX: "1000"
      E2E_PORT: "3100"
      E2E_WEB_SERVER: npx next start -p 3100

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vertex/package-lock.json

      - run: npm ci

      # A fresh signing key per run, so no secret-looking value lives here.
      - run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      # The schema comes from the Alembic migrations, exactly as every
      # deployed stack gets it, never from `prisma db push`: tests must run
      # against the schema that is deployed (a push here hid a drift
      # between the two until the 2026-10-11 DAST scan).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: vertex_be/requirements.txt
      - run: pip install -r requirements.txt && alembic upgrade head
        working-directory: vertex_be
      - run: npx prisma db seed

      - name: Create the e2e bucket
        run: docker exec ${{ job.services.minio.id }} sh -c 'export MC_CONFIG_DIR=/tmp/.mc; mc alias set l http://127.0.0.1:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null && mc mb --ignore-existing l/vertex-e2e'

      - run: npx next build

      - run: npx playwright install --with-deps chromium

      - run: npx playwright test --reporter=line

      - name: Keep screenshots and traces of failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures
          path: vertex/test-results
          retention-days: 14

  # Promotions, manual runs, and PRs into dev that change a Dockerfile, a
  # compose file, the workflows or the Trivy ignore list.
  images:
    name: Image builds (${{ matrix.image }})
    needs: changes
    if: github.base_ref != 'dev' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: vertex-backend, context: vertex_be }
          - { image: vertex-flutter-web, context: vertex_app }
          - { image: vertex-nextjs, context: vertex }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: ${{ matrix.image }}:ci
          # Read-only: reuses the layers build.yml caches for dev, staging
          # and main. Writing here would store a PR's layers where only that
          # same PR can reuse them, filling the 10 GB Actions cache.
          cache-from: type=gha,scope=${{ matrix.image }}
      # E4: a fixable HIGH/CRITICAL finding fails the build. Unfixed ones
      # are the documented exceptions (docs/security/exceptions.md), and so
      # are any dated entries in .trivyignore.yaml.
      - name: Image scan (fixable HIGH/CRITICAL)
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          -v "$PWD/.trivyignore.yaml:/trivyignore.yaml:ro" aquasec/trivy:0.67.2
          image --quiet --ignore-unfixed --severity CRITICAL,HIGH --exit-code 1
          --ignorefile /trivyignore.yaml ${{ matrix.image }}:ci

  # The one check to wait for: skipped jobs count as passed, failed or
  # cancelled ones don't.
  ci-passed:
    name: CI passed
    if: always()
    needs: [changes, secrets, backend, flutter, nextjs, e2e, images]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | python3 -c "
          import json, sys
          bad = [k for k, v in json.load(sys.stdin).items() if v['result'] in ('failure', 'cancelled')]
          print('failed:', bad) if bad else print('all passed or skipped')
          sys.exit(1 if bad else 0)"
